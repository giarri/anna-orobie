<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Orobie di Anna</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛰️</text></svg>">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b5e20">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orobie">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>⛰️ Le Orobie di Anna</h1>
  <div class="stats">
    <span id="progress-text">0 / 86 salite</span>
    <div class="progress-bar"><div id="progress-fill"></div></div>
  </div>
  <div class="filters">
    <select id="filter-group">
      <option value="all">Tutti i gruppi</option>
      <option value="Alpi Orobie">Alpi Orobie</option>
      <option value="Prealpi">Prealpi</option>
    </select>
    <select id="filter-province">
      <option value="all">Tutte le province</option>
      <option value="Bergamo">Bergamo</option>
      <option value="Como">Como</option>
      <option value="Lecco">Lecco</option>
      <option value="Sondrio">Sondrio</option>
    </select>
  </div>
  <button id="random-peak-btn" type="button">🎲 Scegli una montagna a caso</button>
</header>

<div id="map"></div>

<footer>
  <span id="sync-status"></span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://sdk.amazonaws.com/js/aws-sdk-2.1692.0.min.js"></script>
<script src="aws-config.js"></script>
<script src="data/cells.js"></script>
<script src="data/peaks.js"></script>
<script src="app.js"></script>
<script src="install-prompt.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
